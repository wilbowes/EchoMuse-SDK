name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  go-client:
    name: Go reference client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Run Go tests
        working-directory: clients/go
        run: go test -race ./...
      - name: go vet
        working-directory: clients/go
        run: go vet ./...
      - name: Check gofmt
        working-directory: clients/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Guard self-test
        run: python -m unittest discover -s tests -v
      - name: Pins and permissions
        run: python tools/check_workflows.py
      # actionlint from its release tarball, checked against a pinned sha256.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
