name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  go-client:
    name: Go reference client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: |
            clients/go/go.sum
            clients/go/tools/emulator/go.sum
      - name: Run Go tests
        working-directory: clients/go
        run: go test -race ./...
      - name: Run emulator tests
        working-directory: clients/go/tools/emulator
        run: go test -race ./...
      - name: go vet
        working-directory: clients/go
        run: go vet ./...
      - name: go vet the emulator
        working-directory: clients/go/tools/emulator
        run: go vet ./...
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l clients/go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # The core library must build for any platform the application might
  # target, without a C toolchain and without the optional inference
  # runtime. That is what keeps the hardware behind interfaces: the
  # library is the protocol, the connection and the state, and the engine
  # that scores a wake word is the application's choice.
  cross-build:
    name: Cross-build without cgo (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: arm
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: |
            clients/go/go.sum
            clients/go/tools/emulator/go.sum
      - name: Build the core library
        working-directory: clients/go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build ./...
      - name: Build the inference backend
        working-directory: clients/go/backends/onnxruntime
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build ./...
      - name: Build the emulator
        working-directory: clients/go/tools/emulator
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build ./...

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Guard self-test
        run: python -m unittest discover -s tests -v
      - name: Pins and permissions
        run: python tools/check_workflows.py
      # actionlint from its release tarball, checked against a pinned sha256.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
